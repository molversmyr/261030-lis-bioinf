# OPT-IN. Read the README before enabling: on non-Enterprise-Cloud plans the
# published site is public even when the repository is private.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  deploy:
    # Push-triggered deploys only run when the repo variable DEPLOY_PAGES is "true".
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned toolchain
        id: tc
        run: |
          echo "node=$(node -p "require('./.deck.json').node")" >> "$GITHUB_OUTPUT"
          echo "npm=$(node -p "require('./.deck.json').npm")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.tc.outputs.node }}
          cache: npm
      - name: Install pinned npm
        env:
          NPM_VERSION: ${{ steps.tc.outputs.npm }}
        run: npm install -g "npm@$NPM_VERSION"
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
