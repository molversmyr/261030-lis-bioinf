<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1024" />
    <title>Deck</title>
    <link rel="stylesheet" href="./src/theme.css" />
  </head>
  <body class="impress-not-supported">
    <div class="fallback-message">
      <p>Your browser does not support the features impress.js needs; showing a simplified version.</p>
    </div>

    <div id="impress">
      <div class="step slide" data-x="0" data-y="0">
        <h1>Deck title</h1>
        <p>Subtitle or presenter</p>
      </div>
      <div class="step slide" data-x="1200" data-y="0" data-rotate="20">
        <h2>Second step</h2>
        <ul>
          <li>First point</li>
          <li>Second point</li>
        </ul>
      </div>
      <div class="step" data-x="600" data-y="0" data-scale="4"></div>
    </div>

    <!-- Vendored, pinned release (see public/vendor/IMPRESS_VERSION). Relative path keeps the build relocatable. -->
    <script src="./vendor/impress.js"></script>
    <script>
      impress().init();
    </script>
  </body>
</html>
